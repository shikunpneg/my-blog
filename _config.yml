# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
deploy:
  type: git
  repo: git@github.com:shikunpneg/my-blog.git
  branch: main

# Custom scripts (LaTeX pipeline: server-side KaTeX render + KaTeX CSS inject)
scripts:
  - scripts/inject-katex.js

# Markdown engine: markdown-it (replaces hexo-renderer-marked)
# Native LaTeX support via markdown-it-texmath -> KaTeX at build time.
# Rendering happens during markdown parsing, so $...$ / $$...$$ survive
# inside tables, lists, blockquotes, and code blocks are correctly skipped.
markdown:
  preset: 'default'
  render:
    html: true
    xhtmlOut: false
    breaks: false
    linkify: true
    typographer: true
    quotes: '“”‘’'
  plugins:
    - name: 'markdown-it-texmath'
      options:
        engine: 'katex'
        # Support BOTH $...$ / $$...$$ (dollars) AND \(...\) / \[...\] (brackets)
        # because existing posts use both syntaxes (Lora paper uses brackets).
        delimiters: ['dollars', 'brackets', 'beg_end']
        katexOptions:
          throwOnError: false
          errorColor: '#cc0000'
          macros:
            '\\R': '\\mathbb{R}'
  anchors:
    level: 1
    collisionSuffix: ''
    permalink: false
    permalinkClass: 'header-anchor'
    permalinkSide: 'left'
    case: 0
    separator: '-'